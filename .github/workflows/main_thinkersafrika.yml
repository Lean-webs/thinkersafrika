# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - thinkersafrika

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: npm install and build
        run: |
          npm ci
          npm run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy
          cp -R dist/. deploy/
          cat > deploy/package.json <<'EOF'
          {
            "name": "thinkersafrika-site",
            "private": true,
            "version": "1.0.0",
            "scripts": {
              "start": "serve -s . -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.4"
            }
          }
          EOF
          cd deploy && npm install --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_WEBAPP_PUBLISH_PROFILE is missing or empty."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name must be exactly: AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi
          if ! printf '%s' "$PROFILE" | grep -q 'scm.azurewebsites.net'; then
            echo "::error::Publish profile has no Kudu URL (SCM basic auth likely off when downloaded)."
            echo "Azure → thinkersafrika → Configuration → General settings → SCM Basic Auth = On"
            echo "Then Download publish profile again and replace the GitHub secret."
            exit 1
          fi
          echo "Publish profile secret looks valid."

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: thinkersafrika
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
