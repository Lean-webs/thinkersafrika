# Build Vite site and deploy to Azure App Service via Kudu ZipDeploy.
# Uses the publish profile directly (supports new regional SCM hostnames).

name: Build and deploy to Azure Web App - thinkersafrika

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy
          cp -R dist/. deploy/
          cat > deploy/package.json <<'EOF'
          {
            "name": "thinkersafrika-site",
            "private": true,
            "version": "1.0.0",
            "scripts": {
              "start": "serve -s . -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.4"
            }
          }
          EOF
          cd deploy
          npm install --omit=dev
          zip -r ../site.zip .

      - name: Verify publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Missing GitHub secret AZURE_WEBAPP_PUBLISH_PROFILE"
            exit 1
          fi
          if ! printf '%s' "$PUBLISH_PROFILE" | grep -Eqi 'publishMethod="ZipDeploy"|scm\.'; then
            echo "::error::Publish profile does not look like an Azure App Service profile"
            exit 1
          fi
          echo "Publish profile secret is present."

      - name: Deploy with Kudu ZipDeploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          python3 <<'PY'
          import os, re, sys, urllib.request, ssl, base64

          profile = os.environ["PUBLISH_PROFILE"]

          def attrs(tag: str) -> dict[str, str]:
              return {
                  k: v
                  for k, v in re.findall(r'([A-Za-z]+)="([^"]*)"', tag)
              }

          profiles = re.findall(r"<publishProfile\b[^>]*>", profile, flags=re.I)
          if not profiles:
              print("::error::No <publishProfile> entries found in secret", file=sys.stderr)
              sys.exit(1)

          chosen = None
          for tag in profiles:
              a = attrs(tag)
              method = a.get("publishMethod", "")
              url = a.get("publishUrl", "")
              if method == "ZipDeploy" or (method == "MSDeploy" and "scm." in url):
                  chosen = a
                  if method == "ZipDeploy":
                      break

          if not chosen:
              print("::error::Could not find ZipDeploy/MSDeploy credentials in profile", file=sys.stderr)
              sys.exit(1)

          publish_url = chosen["publishUrl"].replace(":443", "")
          user = chosen["userName"]
          password = chosen["userPWD"]
          host = publish_url.split(":")[0]
          deploy_url = f"https://{host}/api/zipdeploy?isAsync=false"

          print(f"Deploying to {deploy_url}")

          data = open("site.zip", "rb").read()
          req = urllib.request.Request(deploy_url, data=data, method="POST")
          token = base64.b64encode(f"{user}:{password}".encode()).decode()
          req.add_header("Authorization", f"Basic {token}")
          req.add_header("Content-Type", "application/octet-stream")
          req.add_header("Content-Length", str(len(data)))

          try:
              with urllib.request.urlopen(req, timeout=600) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  print(f"Status: {resp.status}")
                  if body:
                      print(body[:1000])
          except Exception as exc:
              print(f"::error::ZipDeploy failed: {exc}", file=sys.stderr)
              if hasattr(exc, "read"):
                  try:
                      print(exc.read().decode("utf-8", errors="replace")[:2000], file=sys.stderr)
                  except Exception:
                      pass
              sys.exit(1)

          print("Deploy finished.")
          PY
